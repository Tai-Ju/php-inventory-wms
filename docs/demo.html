<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>互動 Demo · 實習倉 WMS</title>
<meta name="description" content="Laravel 12 簡易庫存管理系統的瀏覽器內互動 Demo：入庫、出庫、超賣防護、低庫存提醒與 REST API 測試台。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1c1914; --paper: #f3ead4; --panel: #fff8e8; --line: #c9b48a;
  --olive: #3f5c3a; --olive-dark: #2a3d28; --rust: #9c4221; --warn: #c45c26;
  --ok: #2f6b4f; --muted: #6d6250; --rail: #241f18; --gold: #d4b36a;
  --low-bg: #fde8d8; --ok-bg: #e4f0e6; --code-bg: #efe2c4;
  --mono: "IBM Plex Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: "Noto Serif TC", "Source Han Serif TC", "PMingLiU", Georgia, serif; color: var(--ink); background: var(--paper); line-height: 1.55; }
a { color: var(--olive-dark); }
code, .mono { font-family: var(--mono); font-size: .85rem; }
code { background: var(--code-bg); padding: .1rem .35rem; }
button { font: inherit; }

/* Demo banner */
.banner { background: var(--ink); color: var(--paper); font-size: .85rem; padding: .55rem 1rem; display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
.banner .badge { font-family: var(--mono); font-size: .72rem; letter-spacing: .14em; border: 1px solid var(--gold); color: var(--gold); padding: .1rem .45rem; }
.banner .grow { flex: 1 1 260px; color: #d9cdb2; }
.banner a, .banner button.linkish { color: var(--gold); }

/* Shell */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100vh - 40px); }
.rail { background: var(--rail); color: var(--paper); padding: 1.4rem 1rem; display: flex; flex-direction: column; gap: 1.4rem; }
.brand { display: flex; gap: .75rem; align-items: center; }
.brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border: 2px solid var(--gold); color: var(--gold); font-weight: 700; font-family: var(--mono); flex: none; }
.brand small { display: block; color: #bba98a; }
.rail nav { display: flex; flex-direction: column; gap: .3rem; }
.rail nav a { color: var(--paper); text-decoration: none; padding: .5rem .7rem; border-left: 3px solid transparent; white-space: nowrap; }
.rail nav a.is-on { border-left-color: var(--gold); background: #352c22; }
.rail nav a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.rail nav .sep { border-top: 1px dashed #4a3f31; margin: .4rem 0; }
.pill { display: inline-block; margin-left: .4rem; background: var(--warn); color: #fff; border-radius: 999px; padding: 0 .45rem; font-size: .75rem; font-family: var(--mono); }
.rail-foot { margin-top: auto; font-size: .9rem; color: #bba98a; }
.linkish { background: none; border: 0; color: var(--gold); cursor: pointer; text-decoration: underline; padding: 0; }

.stage { padding: 1.6rem 2rem 3rem; min-width: 0; }
.page-head { display: flex; justify-content: space-between; gap: 1rem; align-items: end; margin-bottom: 1.2rem; flex-wrap: wrap; }
.eyebrow { letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-size: .72rem; margin: 0 0 .25rem; font-family: var(--mono); }
h1, h2, h3 { font-weight: 700; margin: 0 0 .4rem; }
h1 { font-size: 1.7rem; } h2 { font-size: 1.15rem; }
.muted { color: var(--muted); }

.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .8rem; margin-bottom: 1.2rem; }
.metrics.two { grid-template-columns: repeat(2, minmax(0, 220px)); }
.metrics article { background: var(--panel); border: 1px solid var(--line); padding: .9rem 1rem; box-shadow: 3px 3px 0 #e0d1ad; }
.metrics span { color: var(--muted); font-size: .85rem; }
.metrics strong { display: block; font-size: 1.8rem; font-family: var(--mono); }
.metrics .warn { border-color: var(--warn); background: var(--low-bg); }

.split { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, .9fr); gap: 1rem; }
.panel { background: var(--panel); border: 1px solid var(--line); padding: 1rem 1.1rem; margin-bottom: 1rem; min-width: 0; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: .5rem .4rem; border-bottom: 1px dashed var(--line); vertical-align: top; }
th { font-size: .82rem; color: var(--muted); font-weight: 400; white-space: nowrap; }
td.num { font-family: var(--mono); white-space: nowrap; }
.row-low { background: var(--low-bg); }
.alerts { list-style: none; padding: 0; margin: 0 0 1rem; }
.alerts li { display: flex; justify-content: space-between; gap: .5rem; padding: .5rem 0; border-bottom: 1px dashed var(--line); }
.alerts small { display: block; color: var(--muted); }
.alerts em { font-style: normal; font-family: var(--mono); white-space: nowrap; }
.alerts .in { color: var(--ok); } .alerts .out { color: var(--rust); }

.btn { display: inline-block; background: var(--olive); color: #fff; text-decoration: none; border: 0; padding: .55rem .95rem; cursor: pointer; }
.btn:hover { background: var(--olive-dark); }
.btn.ghost { background: transparent; color: var(--olive-dark); border: 1px solid var(--olive); }
.btn.ghost:hover { background: #ece0c2; }
.btn.danger { background: var(--rust); }
.btn.small { padding: .3rem .6rem; font-size: .88rem; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--olive); outline-offset: 2px; }
.actions { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }

.flash { padding: .7rem .9rem; margin-bottom: 1rem; border: 1px solid; }
.flash.ok { background: var(--ok-bg); border-color: var(--ok); }
.flash.bad { background: var(--low-bg); border-color: var(--warn); }
.err { color: var(--rust); font-size: .88rem; }

.search, .toolbar { display: flex; gap: .6rem; flex-wrap: wrap; align-items: end; }
.form { display: flex; flex-direction: column; gap: .7rem; max-width: 540px; }
label { display: flex; flex-direction: column; gap: .3rem; font-size: .92rem; }
label.inline { flex-direction: row; align-items: center; gap: .4rem; }
input, select, textarea { font: inherit; padding: .45rem .55rem; border: 1px solid var(--line); background: #fff; color: var(--ink); min-width: 0; }
input.is-bad, select.is-bad { border-color: var(--rust); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .8rem; }
.card { background: var(--panel); border: 1px solid var(--line); padding: .9rem; }
.card-low { border-color: var(--warn); box-shadow: inset 4px 0 0 var(--warn); }
.card header { display: flex; justify-content: space-between; gap: .5rem; }
.card footer { display: flex; gap: .6rem; margin-top: .6rem; flex-wrap: wrap; }
.card .qty { font-family: var(--mono); font-size: 1.4rem; }
.tag { background: var(--warn); color: #fff; font-size: .7rem; padding: .1rem .35rem; align-self: start; white-space: nowrap; }
.chip { display: inline-block; font-family: var(--mono); font-size: .75rem; padding: .05rem .4rem; border: 1px solid; }
.chip.in { color: var(--ok); border-color: var(--ok); } .chip.out { color: var(--rust); border-color: var(--rust); }

/* source hint */
.source { margin-top: 1.4rem; border-top: 1px dashed var(--line); padding-top: .8rem; font-size: .85rem; color: var(--muted); }
.source a { font-family: var(--mono); font-size: .8rem; margin-right: .8rem; display: inline-block; }

/* login gate */
.gate-wrap { min-height: calc(100vh - 40px); display: grid; place-items: center; padding: 1.5rem 1rem; background: radial-gradient(circle at 20% 20%, #d4b36a33, transparent 35%), repeating-linear-gradient(135deg, #ead7ad 0 12px, #e2cc96 12px 24px); }
.gate { width: min(420px, 100%); background: var(--panel); padding: 1.6rem; border: 1px solid var(--line); display: flex; flex-direction: column; gap: .75rem; box-shadow: 8px 8px 0 var(--rail); }
.hint { background: var(--code-bg); padding: .6rem .75rem; font-size: .85rem; }

/* concurrency */
.race { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; margin-top: .8rem; }
.lane { border: 1px solid var(--line); background: #fffdf6; }
.lane h3 { font-size: .95rem; padding: .55rem .75rem; margin: 0; border-bottom: 1px solid var(--line); background: #f5ead0; }
.lane.bad h3 { background: var(--low-bg); } .lane.good h3 { background: var(--ok-bg); }
.lane ol { margin: 0; padding: .5rem .75rem .75rem 2rem; font-size: .88rem; min-height: 9rem; }
.lane li { padding: .2rem 0; opacity: 0; transform: translateY(4px); transition: opacity .25s, transform .25s; }
.lane li.show { opacity: 1; transform: none; }
.lane li .who { font-family: var(--mono); font-weight: 600; }
.lane li .who.a { color: #2f5a8a; } .lane li .who.b { color: #8a2f6b; }
.lane .verdict { margin: 0 .75rem .75rem; padding: .5rem .6rem; font-size: .88rem; border: 1px solid; display: none; }
.lane .verdict.show { display: block; }
.lane.bad .verdict { border-color: var(--warn); background: var(--low-bg); }
.lane.good .verdict { border-color: var(--ok); background: var(--ok-bg); }

/* API console */
.api-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; }
.api-req { display: flex; flex-direction: column; gap: .6rem; }
.api-line { display: flex; gap: .4rem; flex-wrap: wrap; }
.api-line select { flex: 1 1 220px; font-family: var(--mono); font-size: .88rem; }
.api-line input { flex: 1 1 120px; font-family: var(--mono); font-size: .88rem; }
textarea.json { font-family: var(--mono); font-size: .82rem; min-height: 9rem; resize: vertical; }
pre.out { background: var(--rail); color: #efe5cc; font-family: var(--mono); font-size: .8rem; padding: .8rem; margin: 0; overflow: auto; max-height: 26rem; white-space: pre-wrap; word-break: break-word; }
.status { font-family: var(--mono); font-size: .85rem; padding: .15rem .5rem; color: #fff; display: inline-block; }
.status.s2 { background: var(--ok); } .status.s4 { background: var(--warn); }
.curl { font-family: var(--mono); font-size: .78rem; background: var(--code-bg); padding: .5rem .6rem; overflow-x: auto; white-space: pre; }
.presets { display: flex; gap: .35rem; flex-wrap: wrap; }

@media (max-width: 960px) {
  .shell { grid-template-columns: 1fr; }
  .rail { flex-direction: column; gap: .8rem; padding: .9rem 1rem; }
  .rail nav { flex-direction: row; overflow-x: auto; gap: .2rem; padding-bottom: .2rem; }
  .rail nav a { border-left: 0; border-bottom: 3px solid transparent; padding: .4rem .55rem; }
  .rail nav a.is-on { border-bottom-color: var(--gold); }
  .rail nav .sep { display: none; }
  .rail-foot { margin-top: 0; display: flex; gap: .8rem; }
  .stage { padding: 1.2rem 1rem 2.5rem; }
  .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split, .api-grid, .race { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .lane li { transition: none; } }
</style>
</head>
<body>
<div class="banner" role="note">
  <span class="badge">STATIC DEMO</span>
  <span class="grow">在瀏覽器內模擬 Laravel 版的行為：邏輯照 <code style="background:#3a3127;color:#efe5cc">StockService.php</code> 重寫，資料只存在你的瀏覽器。</span>
  <a href="./">← 專案介紹</a>
  <a href="https://github.com/Tai-Ju/php-inventory-wms">GitHub</a>
  <button class="linkish" id="reset-btn" type="button">重設示範資料</button>
</div>
<div id="app"></div>

<script>
(() => {
  'use strict';

  const REPO = 'https://github.com/Tai-Ju/php-inventory-wms/blob/main/inventory-wms/';
  const STORE_KEY = 'wms-demo-v1';
  const USER = { id: 1, name: '倉管示範帳號', email: 'warehouse@example.com', password: 'password', token: 'demo-api-token' };

  // ---------- data (mirrors DatabaseSeeder) ----------
  function seed() {
    const now = Date.now();
    const iso = (minsAgo) => new Date(now - minsAgo * 60000).toISOString();
    const items = [
      ['MED-MASK-01', '醫用口罩', '盒', 80, 20, 'A-01-01'],
      ['MED-ALC-75', '75% 酒精', '瓶', 8, 15, 'A-01-02'],
      ['MED-GLV-M', '檢診手套 M', '盒', 5, 10, 'B-02-01'],
      ['MED-THM-01', '額溫槍', '支', 12, 5, 'C-01-01'],
      ['MED-GAU-10', '紗布塊 10x10', '包', 40, 12, 'B-03-02'],
      ['MED-NS-500', '生理食鹽水 500ml', '瓶', 3, 8, 'A-02-03'],
    ];
    const products = items.map((r, i) => ({
      id: i + 1, sku: r[0], name: r[1], unit: r[2], quantity: r[3], safety_stock: r[4],
      location: r[5], notes: null, created_at: iso(600), updated_at: iso(600),
    }));
    // a few sample movements so the dashboard is not empty (quantities above are the result)
    const movements = [
      { id: 1, product_id: 1, user_id: 1, type: 'in', quantity: 50, before_qty: 30, after_qty: 80, remark: '進貨單 PO-2026-031', created_at: iso(180) },
      { id: 2, product_id: 5, user_id: 1, type: 'out', quantity: 10, before_qty: 50, after_qty: 40, remark: '急診領用', created_at: iso(95) },
      { id: 3, product_id: 6, user_id: 1, type: 'out', quantity: 9, before_qty: 12, after_qty: 3, remark: '病房領用 7B', created_at: iso(30) },
    ];
    return { products, movements, nextPid: 7, nextMid: 4, authed: false };
  }

  let db;
  function load() {
    try { const raw = localStorage.getItem(STORE_KEY); if (raw) { db = JSON.parse(raw); return; } } catch (e) { /* storage unavailable */ }
    db = seed();
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch (e) { /* ignore */ } }

  // ---------- helpers ----------
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = (sel, root = document) => root.querySelector(sel);
  const fmt = (iso, withYear) => {
    const d = new Date(iso); const p = (n) => String(n).padStart(2, '0');
    const md = `${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    return withYear ? `${d.getFullYear()}-${md.replace('/', '-')}` : md;
  };
  const isLow = (p) => p.quantity <= p.safety_stock;           // Product::isLowStock()
  const lowStock = () => db.products.filter(isLow);              // Product::scopeLowStock()
  const bySku = (a, b) => a.sku.localeCompare(b.sku);
  const findProduct = (id) => db.products.find((p) => p.id === Number(id));
  const latest = (list) => [...list].sort((a, b) => b.created_at.localeCompare(a.created_at) || b.id - a.id);
  const like = (field, kw) => String(field ?? '').toLowerCase().includes(kw.toLowerCase());

  // ---------- validation (Laravel FormRequest messages, en fallback + zh attributes) ----------
  const ATTR = { sku: '料號', name: '品名', unit: '單位', safety_stock: '安全庫存', location: '儲位', notes: '備註', product_id: '商品', quantity: '數量', remark: '備註' };
  const isInt = (v) => typeof v === 'number' ? Number.isInteger(v) : /^-?\d+$/.test(String(v ?? '').trim());
  const blank = (v) => v === undefined || v === null || String(v).trim() === '';

  function validate(data, rules) {
    const errors = {};
    for (const [field, list] of Object.entries(rules)) {
      const v = data[field]; const a = ATTR[field];
      for (const rule of list) {
        let msg = null;
        const [name, arg] = rule.split(':');
        if (name === 'required' && blank(v)) msg = `The ${a} field is required.`;
        else if (blank(v)) { if (list.includes('nullable') || !list.includes('required')) break; }
        else if (name === 'integer' && !isInt(v)) msg = `The ${a} field must be an integer.`;
        else if (name === 'min' && isInt(v) && Number(v) < Number(arg)) msg = `The ${a} field must be at least ${arg}.`;
        else if (name === 'max' && String(v).length > Number(arg)) msg = `The ${a} field must not be greater than ${arg} characters.`;
        else if (name === 'unique' && db.products.some((p) => p.sku === String(v).trim() && p.id !== Number(arg || 0))) msg = `The ${a} has already been taken.`;
        else if (name === 'exists' && !findProduct(v)) msg = `The selected ${a} is invalid.`;
        if (msg) { errors[field] = [msg]; break; }
      }
    }
    return errors;
  }
  const productRules = (ignoreId) => ({
    sku: ['required', 'max:50', `unique:${ignoreId || 0}`], name: ['required', 'max:120'], unit: ['required', 'max:20'],
    safety_stock: ['required', 'integer', 'min:0'], location: ['nullable', 'max:80'], notes: ['nullable', 'max:500'],
  });
  const moveRules = { product_id: ['required', 'integer', 'exists'], quantity: ['required', 'integer', 'min:1'], remark: ['nullable', 'max:255'] };
  function validationBody(errors) {
    const msgs = Object.values(errors).map((x) => x[0]);
    const extra = msgs.length - 1;
    return { message: msgs[0] + (extra > 0 ? ` (and ${extra} more error${extra > 1 ? 's' : ''})` : ''), errors };
  }
  const nn = (v) => (blank(v) ? null : String(v).trim());

  // ---------- StockService (inbound / outbound) ----------
  class InsufficientStockException extends Error {
    static for(sku, onHand, requested) { return new InsufficientStockException(`SKU ${sku} 庫存不足（現有 ${onHand}，欲出庫 ${requested}）`); }
  }
  function move(type, product, qty, remark) {
    // DB::transaction + lockForUpdate: in the browser everything is single-threaded, so the read-check-write below is atomic.
    const locked = findProduct(product.id);
    const before = locked.quantity;
    if (type === 'out' && qty > before) throw InsufficientStockException.for(locked.sku, before, qty);
    locked.quantity = type === 'in' ? before + qty : before - qty;
    locked.updated_at = new Date().toISOString();
    const m = { id: db.nextMid++, product_id: locked.id, user_id: USER.id, type, quantity: qty, before_qty: before, after_qty: locked.quantity, remark: nn(remark), created_at: new Date().toISOString() };
    db.movements.push(m);
    save();
    return m;
  }

  // ---------- router ----------
  let flash = null;
  function go(hash, msg) { flash = msg || null; if (location.hash === hash) render(); else location.hash = hash; }
  function route() {
    const h = location.hash.replace(/^#\/?/, '');
    const [path, qs] = h.split('?');
    return { parts: path.split('/').filter(Boolean), q: new URLSearchParams(qs || '') };
  }

  // ---------- layout ----------
  const NAV = [
    ['dashboard', '庫存看板'], ['products', '商品主檔'], ['stock/in', '入庫'], ['stock/out', '出庫'],
    ['stock/history', '異動紀錄'], ['products?low=1', '低庫存'], null, ['race', '超賣攻防'], ['api', 'API 測試台'],
  ];
  function shell(current, content, sources) {
    const low = lowStock().length;
    const nav = NAV.map((n) => {
      if (!n) return '<div class="sep" aria-hidden="true"></div>';
      const [href, label] = n;
      const on = href === current ? ' is-on' : '';
      const pill = href === 'products?low=1' && low > 0 ? `<span class="pill">${low}</span>` : '';
      return `<a href="#/${href}" class="${on.trim()}"${on ? ' aria-current="page"' : ''}>${label}${pill}</a>`;
    }).join('');
    const src = sources && sources.length
      ? `<div class="source">對應原始碼：${sources.map(([label, path]) => `<a href="${REPO}${path}" target="_blank" rel="noopener">${esc(label)}</a>`).join('')}</div>` : '';
    const f = flash ? `<div class="flash ${flash.bad ? 'bad' : 'ok'}" role="status">${esc(flash.text)}</div>` : '';
    flash = null;
    return `<div class="shell">
      <aside class="rail">
        <div class="brand"><span class="brand-mark">NT</span><div><strong>實習倉 WMS</strong><small>北護 · 簡易庫存</small></div></div>
        <nav aria-label="主選單">${nav}</nav>
        <div class="rail-foot"><span>${esc(USER.name)}</span> <button type="button" class="linkish" data-act="logout">登出</button></div>
      </aside>
      <main class="stage">${f}${content}${src}</main>
    </div>`;
  }

  // ---------- views ----------
  function viewLogin(err, email) {
    return `<div class="gate-wrap"><form class="gate" data-form="login" novalidate>
      <p class="eyebrow">Sign in</p><h1>實習倉 WMS</h1>
      ${err ? `<div class="flash bad" role="alert">${esc(err)}</div>` : ''}
      <label>Email<input name="email" type="email" autocomplete="username" value="${esc(email ?? USER.email)}"></label>
      <label>密碼<input name="password" type="password" autocomplete="current-password" value="password"></label>
      <button class="btn" type="submit">登入</button>
      <p class="hint">示範帳號已預填：<code>${USER.email}</code> / <code>password</code>。<br>真實系統用 Session 保存登入狀態，密碼以 <code>hashed</code> cast（bcrypt）存放，表單帶 <code>@csrf</code>。</p>
    </form></div>`;
  }

  function productRows(list, cols) {
    if (!list.length) return `<tr><td colspan="${cols}">沒有符合的商品</td></tr>`;
    return list.map((p) => `<tr class="${isLow(p) ? 'row-low' : ''}">

    if (!token) return [401, { message: '未提供 Bearer Token' }];
    if (token !== USER.token) return [401, { message: 'Token 無效' }];
    const u = new URL(url, 'http://127.0.0.1:8000');
    const path = u.pathname; const q = u.searchParams;
    const notFound = (id) => [404, { message: `No query results for model [App\\Models\\Product] ${id}` }];
    let m;
    if (method === 'GET' && path === '/api/products') {
      const kw = (q.get('q') || '').trim(); const low = ['1', 'true'].includes(q.get('low'));
      const data = db.products.filter((p) => (!kw || like(p.sku, kw) || like(p.name, kw)) && (!low || isLow(p))).sort(bySku).map(productJson);
      return [200, { current_page: 1, data, first_page_url: `${u.origin}/api/products?page=1`, from: data.length ? 1 : null, last_page: 1, per_page: 20, to: data.length || null, total: data.length }];
    }
    if (method === 'GET' && path === '/api/stock/low') return [200, lowStock().sort((a, b) => a.quantity - b.quantity).map(productJson)];
    if ((m = path.match(/^\/api\/products\/(\d+)$/))) {
      const p = findProduct(m[1]); if (!p) return notFound(m[1]);
      if (method === 'GET') return [200, { ...productJson(p), movements: latest(db.movements.filter((x) => x.product_id === p.id)).map(moveJson) }];
      if (method === 'PUT') {
        const errs = validate(body, productRules(p.id)); if (Object.keys(errs).length) return [422, validationBody(errs)];
        Object.assign(p, { sku: String(body.sku).trim(), name: String(body.name).trim(), unit: String(body.unit).trim(), safety_stock: Number(body.safety_stock), location: nn(body.location), notes: nn(body.notes), updated_at: new Date().toISOString() });
        save(); return [200, productJson(p)];
      }
    }
    if (method === 'POST' && path === '/api/products') {
      const errs = validate(body, productRules()); if (Object.keys(errs).length) return [422, validationBody(errs)];
      const p = createProduct(body); return [201, productJson(p)];
    }
    if (method === 'POST' && (path === '/api/stock/in' || path === '/api/stock/out')) {
      const errs = validate(body, moveRules); if (Object.keys(errs).length) return [422, validationBody(errs)];
      const p = findProduct(body.product_id); const type = path.endsWith('/in') ? 'in' : 'out';
      try { const mv = move(type, p, Number(body.quantity), body.remark); return [201, { movement: moveJson(mv), product: productJson(findProduct(p.id)) }]; }
      catch (e) { if (e instanceof InsufficientStockException) return [422, { message: e.message }]; throw e; }
    }
    return [405, { message: `The ${method} method is not supported for route ${path.slice(1)}.` }];
  }
  function apiSend() {
    const ep = ENDPOINTS[Number($('#api-ep').value)];
    let body = null;
    if (ep[2]) { try { body = JSON.parse($('#api-body').value || '{}'); } catch (e) { showApi(400, { message: 'Request body 不是合法 JSON：' + e.message }); return; } }
    const [status, json] = handleApi(ep[0], ep[1], $('#api-token').value.trim(), body || {});
    showApi(status, json);
  }
  const STATUS_TEXT = { 200: 'OK', 201: 'Created', 400: 'Bad Request', 401: 'Unauthorized', 404: 'Not Found', 405: 'Method Not Allowed', 422: 'Unprocessable Content' };
  function showApi(status, json) {
    $('#api-status').innerHTML = `<span class="status ${status < 300 ? 's2' : 's4'}">${status} ${STATUS_TEXT[status] || ''}</span>`;
    $('#api-out').textContent = JSON.stringify(json, null, 2);
    // refresh low-stock pill in the rail without a full re-render
    const pillHost = document.querySelector('.rail nav a[href="#/products?low=1"]');
    if (pillHost) { const n = lowStock().length; pillHost.innerHTML = `低庫存${n ? `<span class="pill">${n}</span>` : ''}`; }
  }
  function apiPreset(k) {
    const sel = $('#api-ep');
    if (k === 'notoken') { $('#api-token').value = ''; }
    else if (k === 'badtoken') { $('#api-token').value = 'guess-token'; }
    else if (k === 'over') { $('#api-token').value = USER.token; sel.value = '6'; apiSyncBody(); const p = findProduct(6) || db.products[0]; $('#api-body').value = JSON.stringify({ product_id: p.id, quantity: p.quantity + 5, remark: '超量測試' }, null, 2); }
    else if (k === 'invalid') { $('#api-token').value = USER.token; sel.value = '7'; apiSyncBody(); $('#api-body').value = JSON.stringify({ sku: 'MED-MASK-01', name: '', unit: '盒', safety_stock: -1 }, null, 2); }
    apiCurl(); apiSend();
  }

  // ---------- actions ----------
  function createProduct(body) {
    const now = new Date().toISOString();
    const p = { id: db.nextPid++, sku: String(body.sku).trim(), name: String(body.name).trim(), unit: String(body.unit).trim(), quantity: 0, safety_stock: Number(body.safety_stock), location: nn(body.location), notes: nn(body.notes), created_at: now, updated_at: now };
    db.products.push(p); save(); return p;
  }
  const formData = (form) => Object.fromEntries(new FormData(form).entries());

  document.addEventListener('submit', (ev) => {
    const form = ev.target.closest('form[data-form]'); if (!form) return;
    ev.preventDefault();
    const kind = form.dataset.form; const data = formData(form);
    if (kind === 'login') {
      if (data.email.trim().toLowerCase() === USER.email && data.password === USER.password) { db.authed = true; save(); go('#/dashboard', { text: `歡迎回來，${USER.name}。` }); }
      else app.innerHTML = viewLogin('帳號或密碼錯誤。', data.email);
      return;
    }
    if (kind === 'search') { go(`#/dashboard${data.q.trim() ? `?q=${encodeURIComponent(data.q.trim())}` : ''}`); return; }
    if (kind === 'product-filter') {
      const qs = new URLSearchParams(); if (data.q.trim()) qs.set('q', data.q.trim()); if (data.low) qs.set('low', '1');
      go(`#/products${qs.toString() ? `?${qs}` : ''}`); return;
    }
    if (kind === 'product') {
      const id = Number(form.dataset.id) || null;
      const errs = validate(data, productRules(id));
      if (Object.keys(errs).length) { app.innerHTML = viewProductForm(id, data, errs); focusFirstError(); return; }
      if (id) {
        const p = findProduct(id);
        Object.assign(p, { sku: data.sku.trim(), name: data.name.trim(), unit: data.unit.trim(), safety_stock: Number(data.safety_stock), location: nn(data.location), notes: nn(data.notes), updated_at: new Date().toISOString() });
        save(); go(`#/products/${id}`, { text: '商品資料已更新。' });
      } else { createProduct(data); go('#/products', { text: '商品已建立，庫存為 0，請進行入庫。' }); }
      return;
    }
    if (kind === 'stock') {
      const mode = form.dataset.mode; const q = route().q;
      const errs = validate(data, moveRules);
      if (Object.keys(errs).length) { app.innerHTML = viewStockForm(mode, q, data, errs); focusFirstError(); return; }
      const p = findProduct(data.product_id);
      try { move(mode, p, Number(data.quantity), data.remark); go(`#/products/${p.id}`, { text: mode === 'in' ? '入庫完成。' : '出庫完成。' }); }
      catch (e) {
        if (!(e instanceof InsufficientStockException)) throw e;
        app.innerHTML = viewStockForm(mode, q, data, { quantity: [e.message], _stock: '出庫被擋下：交易已回滾，庫存沒有被改動。' }); focusFirstError();
      }
    }
  });
  function focusFirstError() { const el = document.querySelector('.is-bad'); if (el) el.focus(); }

  document.addEventListener('click', (ev) => {
    const btn = ev.target.closest('[data-act]'); if (!btn) return;
    const act = btn.dataset.act;
    if (act === 'logout') { db.authed = false; save(); go('#/login'); }
    else if (act === 'delete') {
      const p = findProduct(btn.dataset.id); if (!p) return;
      if (btn.dataset.armed !== '1') { btn.dataset.armed = '1'; btn.textContent = '再按一次確認刪除'; setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = ''; btn.textContent = '刪除'; } }, 4000); return; }
      db.products = db.products.filter((x) => x.id !== p.id);
      db.movements = db.movements.filter((m) => m.product_id !== p.id); // cascadeOnDelete
      save(); go('#/products', { text: '商品已刪除。' });
    }
    else if (act === 'race-play') playRace();
    else if (act === 'api-send') apiSend();
    else if (act === 'api-preset') apiPreset(btn.dataset.k);
  });
  document.addEventListener('change', (ev) => { if (ev.target.id === 'api-ep') apiSyncBody(); });
  document.addEventListener('input', (ev) => { if (ev.target.id === 'api-token' || ev.target.id === 'api-body') apiCurl(); });

  $('#reset-btn').addEventListener('click', () => { const authed = db.authed; db = seed(); db.authed = authed; save(); go(authed ? '#/dashboard' : '#/login', { text: '示範資料已重設。' }); });

  // ---------- render ----------
  const app = $('#app');
  function render() {
    const { parts, q } = route();
    const [a, b, c] = parts;
    if (!db.authed) { app.innerHTML = viewLogin(); document.title = '登入 · 實習倉 WMS Demo'; return; }
    let html; let title = '庫存看板';
    if (!a || a === 'login' || a === 'dashboard') html = viewDashboard(q);
    else if (a === 'products' && !b) { html = viewProducts(q); title = q.get('low') === '1' ? '低庫存' : '商品主檔'; }
    else if (a === 'products' && b === 'create') { html = viewProductForm(null); title = '新增商品'; }
    else if (a === 'products' && c === 'edit') { html = viewProductForm(Number(b)); title = '編輯商品'; }
    else if (a === 'products') { html = viewProduct(Number(b)); const p = findProduct(b); title = p ? p.name : '找不到商品'; }
    else if (a === 'stock' && (b === 'in' || b === 'out')) { html = viewStockForm(b, q); title = b === 'in' ? '入庫' : '出庫'; }
    else if (a === 'stock' && b === 'history') { html = viewHistory(q); title = '異動紀錄'; }
    else if (a === 'race') { html = viewRace(); title = '超賣攻防'; }
    else if (a === 'api') { html = viewApi(); title = 'API 測試台'; }
    else html = viewDashboard(q);
    app.innerHTML = html;
    document.title = `${title} · 實習倉 WMS Demo`;
    if (a === 'api') apiSyncBody();
    window.scrollTo(0, 0);
  }

  load();
  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
